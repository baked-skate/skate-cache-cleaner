name: Release

# Push a tag like v1.0.0 to publish ClearSkateCache.bat, zipped, as a release.
# Zipped because browsers warn on a bare .bat download.
# The README's button links to releases/latest, so it always gets the newest one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cmd misreads labels in an LF-only .bat; .gitattributes should keep it CRLF.
      - name: Check line endings
        run: |
          if grep -qv $'\r$' ClearSkateCache.bat; then
            echo "::error::ClearSkateCache.bat has LF line endings; it needs CRLF."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip baked-cache-clearing-tool.zip ClearSkateCache.bat
          gh release create "$GITHUB_REF_NAME" baked-cache-clearing-tool.zip \
            --title "baked. cache clearing tool $GITHUB_REF_NAME" \
            --notes "Download **baked-cache-clearing-tool.zip** below, open it, then double-click ClearSkateCache.bat. Steps and help: https://github.com/$GITHUB_REPOSITORY#readme"
